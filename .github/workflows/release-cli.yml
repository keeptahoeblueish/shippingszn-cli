name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in package.json
        required: true
        type: string
      confirm:
        description: Type PUBLISH SHIPPINGSZN CLI to authorize this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-shippingszn-cli
  cancel-in-progress: false

jobs:
  compatibility:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "22"
    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.11.0

      - name: Install exact dependencies
        run: npm ci

      - name: Verify Node compatibility and release artifact
        run: |
          npm run verify:export
          npm run typecheck
          npm test
          npm run build
          node scripts/verify-export.mjs --release

  publish:
    needs: compatibility
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.11.0

      - name: Validate release request
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CONFIRMATION" != "PUBLISH SHIPPINGSZN CLI" ]; then
            echo "Release confirmation did not match the required phrase." >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [ "$REQUESTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested version does not match the committed package version." >&2
            exit 1
          fi

          if npm view "shippingszn@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "That package version is already published." >&2
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Verify exported source
        run: npm run verify:export

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify executable and locked fixture
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import packageJson from "./package.json" with { type: "json" };

          const version = execFileSync(
            process.execPath,
            ["dist/index.js", "--version"],
            { encoding: "utf8" },
          ).trim();
          if (version !== packageJson.version) {
            throw new Error("built CLI version does not match package.json");
          }

          const stdout = execFileSync(
            process.execPath,
            [
              "dist/index.js",
              "test/fixtures/cli-exit/clean",
              "--json",
              "--no-color",
              "--no-telemetry",
            ],
            { encoding: "utf8" },
          );
          const report = JSON.parse(stdout);
          if (report.detailsLocked !== true || Object.hasOwn(report, "findings")) {
            throw new Error("fixture output crossed the score-only public boundary");
          }
          NODE

      - name: Verify release artifact boundary
        run: node scripts/verify-export.mjs --release

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public

      - name: Verify the published package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PUBLISHED_VERSION=""
          for ATTEMPT in 1 2 3 4 5 6; do
            PUBLISHED_VERSION="$(npm view "shippingszn@$RELEASE_VERSION" version 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$RELEASE_VERSION" ]; then
              break
            fi
            sleep 10
          done
          test "$PUBLISHED_VERSION" = "$RELEASE_VERSION"
          test "$(npx --yes "shippingszn@$RELEASE_VERSION" --version)" = "$RELEASE_VERSION"
